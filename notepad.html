<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notepad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        textarea {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Lucida Console', monospace;
            font-size: 24px;
            padding: 10px;
            resize: none;
        }
    </style>
</head>

<body>
    <textarea id="note" autofocus></textarea>
</body>

</html>
